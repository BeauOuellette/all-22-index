name: build play index

# nflverse republishes the whole season asset in place rather than shipping
# per-game deltas, so we rebuild on a schedule and only publish when the
# resulting artifact actually changed.
on:
  schedule:
    - cron: "17 9 * * *"        # 09:17 UTC daily — after nflverse's own runs
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to build, space separated"
        default: "2025"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build index
        run: python3 build_index.py ${{ github.event.inputs.seasons || '2025' }}

      - name: Compare with published manifest
        id: diff
        run: |
          NEW=$(python3 -c "import json;print(json.load(open('data/dist/manifest.json'))['sha256'])")
          OLD=$(curl -sfL https://github.com/${{ github.repository }}/releases/latest/download/manifest.json \
                | python3 -c "import json,sys;print(json.load(sys.stdin).get('sha256',''))" 2>/dev/null || echo "")
          echo "new=$NEW" >> $GITHUB_OUTPUT
          if [ "$NEW" = "$OLD" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Index unchanged ($NEW) — nothing to publish."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Index changed: $OLD -> $NEW"
          fi

      - name: Publish release
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="index-$(date -u +%Y%m%d)"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            data/dist/manifest.json data/dist/*.db.gz \
            --latest \
            --title "Play index $(date -u +%Y-%m-%d)" \
            --notes "$(python3 -c "
import json; m=json.load(open('data/dist/manifest.json'))
print('%d plays · %d columns · seasons %s' % (m['rows'], m['columns'], ', '.join(map(str, m['seasons']))))
print()
print('Built from nflverse play-by-play. The extension polls this release and')
print('downloads only when the sha256 changes.')
print()
print('sha256: %s' % m['sha256'])")"
