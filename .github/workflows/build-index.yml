name: build play index

# nflverse republishes the whole season asset in place rather than shipping
# per-game deltas, so we rebuild on a schedule and publish only when the
# resulting artifact actually changed.
#
# nflverse's own updater (nflverse/nflverse-pbp, update_data.yaml) is cron'd at
# 09:03 UTC daily and has been landing 09:30-10:00 UTC; its game-night runs
# (TNF Fri, SNF/MNF Mon/Tue) fire 05:33 UTC, and Sunday's windows 22:03 UTC
# Sun and 00:07 UTC Mon. GitHub then delays *our* scheduled runs by up to a
# few hours, unpredictably. So: one slot right after their daily run has
# settled, one catch-up in the afternoon for the days GitHub or nflverse ran
# late, and one late Sunday night to pick up the day's games. A run that finds
# nothing changed costs a couple of Actions minutes and publishes nothing.
on:
  schedule:
    - cron: "37 10 * * *"       # 10:37 UTC / 6:37 AM ET daily, after nflverse's 09:03 UTC run
    - cron: "37 14 * * *"       # 14:37 UTC / 10:37 AM ET catch-up
    - cron: "37 1 * * 1"        # Mon 01:37 UTC / Sun 9:37 PM ET, after the Sunday windows
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to build, space separated"
        default: "2025 2026"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The scheduled run gets no inputs, so this fallback -- not the
      # workflow_dispatch default above -- is what the daily build uses.
      # Add the new season here each September; nflverse publishes the
      # season's pbp asset before week 1, and building a season it has not
      # published yet fails the whole job.
      - name: Build index
        run: python3 build_index.py ${{ github.event.inputs.seasons || '2025 2026' }}

      - name: Compare with the published manifest
        id: diff
        run: |
          # content_hash is over every part's content id -- the rows, not the
          # gzip/SQLite bytes, which shift whenever the runner's zlib or SQLite
          # changes and would republish identical data for nothing.
          NEW=$(python3 -c "import json;print(json.load(open('data/dist/manifest.json'))['content_hash'])")
          OLD=$(curl -sfL "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/manifest.json" \
                | python3 -c "import json,sys;print(json.load(sys.stdin).get('content_hash',''))" 2>/dev/null || echo "")
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$NEW" = "$OLD" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Index unchanged ($NEW) - nothing to publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Index changed: ${OLD:-none} -> $NEW"
          fi

      - name: Write release notes
        if: steps.diff.outputs.changed == 'true'
        run: |
          python3 - <<'PY' > notes.md
          import json
          m = json.load(open("data/dist/manifest.json"))
          print("%d plays  ·  %d columns  ·  seasons %s"
                % (m["rows"], m["columns"], ", ".join(map(str, m["seasons"]))))
          print()
          print("Built from nflverse play-by-play plus FTN charting.")
          print("Published as parts: one file per completed season, one per week of the")
          print("newest season, one for players. Consumers poll `manifest.json` and")
          print("download only the parts whose content id changed.")
          print()
          for p in m["parts"]:
              print("    %-24s %7d rows  %6.2f MB  sha256 %s" % (p["file"], p["rows"], p["bytes"] / 1e6, p["sha256"][:16]))
          PY

      - name: Publish release
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="index-$(date -u +%Y%m%d)"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            data/dist/manifest.json data/dist/*.db.gz \
            --latest \
            --title "Play index $(date -u +%Y-%m-%d)" \
            --notes-file notes.md
